# Send nginx logs to the container's stdout/stderr so that
# `docker compose logs proxy` shows them on any base image.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    upstream app_backend {
        server backend:8080;
    }

    server {
        listen 80;

        location /nginx-health {
            default_type application/json;
            return 200 '{"proxy": "ok"}';
        }

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}