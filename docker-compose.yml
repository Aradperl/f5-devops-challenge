services:
  backend:
    build: ./backend
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\")'"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 30s

  proxy:
    build: ./proxy
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  test-runner:
    build: ./test-runner
    environment:
      - PROXY_URL=http://proxy:80
    depends_on:
      - proxy